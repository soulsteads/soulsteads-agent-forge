name: Locked build and installed PostgreSQL smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installed-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: forge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CARGO_BUILD_JOBS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Isolate build and smoke state
        run: |
          {
            printf 'CARGO_HOME=%s/forge-cargo\n' "$RUNNER_TEMP"
            printf 'CARGO_TARGET_DIR=%s/forge-target\n' "$RUNNER_TEMP"
            printf 'FORGE_TEST_STATE=%s/forge-smoke\n' "$RUNNER_TEMP"
            printf 'FORGE_BINARY=%s/forge-install/bin/agent-forge\n' "$RUNNER_TEMP"
            printf 'TMPDIR=%s\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Offline publication safety
        env:
          FORGE_SOURCE_SCOPE: public
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check_public_source.py --revision HEAD --scope "$FORGE_SOURCE_SCOPE"
          python3 scripts/check_notices.py --revision HEAD
      - name: Public system dependencies and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl python3 nodejs
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Locked static checks
        run: |
          cargo +1.100.0 fmt --all -- --check
          cargo +1.100.0 clippy --locked --all-targets -j 1
      - name: Locked installed binary
        run: cargo +1.100.0 install --locked --path . --root "$RUNNER_TEMP/forge-install" -j 1
      - name: Dashboard regressions
        run: node --test tests/dashboard-*.test.cjs
      - name: Locked Rust tests
        run: |
          # Only the disposable test service gets cgroup delegation. Cargo and
          # its fixtures still run as the unprivileged Actions runner.
          sudo -n /usr/bin/systemd-run --wait --pipe --collect --quiet \
            --unit="forge-ci-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes \
            --working-directory="$GITHUB_WORKSPACE" --expand-environment=no \
            --setenv="HOME=$HOME" --setenv="PATH=$PATH" \
            --setenv="RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            --setenv="CARGO_HOME=$CARGO_HOME" --setenv="CARGO_TARGET_DIR=$CARGO_TARGET_DIR" \
            --setenv="CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS" --setenv="TMPDIR=$TMPDIR" \
            --setenv="PYTHONDONTWRITEBYTECODE=1" \
            /usr/bin/bash -euo pipefail -c '
              python3 -I -B - <<"PY"
          import os
          from pathlib import Path
          import signal
          import subprocess

          assert os.geteuid() != 0, "Rust tests must run unprivileged"
          relative = next(line.removeprefix("0::") for line in
                          Path("/proc/self/cgroup").read_text().splitlines()
                          if line.startswith("0::"))
          assert relative.startswith("/") and relative != "/", "expected a delegated test service"
          leaf = Path("/sys/fs/cgroup") / relative.lstrip("/") / "forge-ci-probe"
          leaf.mkdir()
          try:
              with subprocess.Popen(["sleep", "30"]) as child:
                  try:
                      procs = leaf / "cgroup.procs"
                      procs.write_text(f"{child.pid}\n")
                      assert str(child.pid) in procs.read_text().splitlines()
                      (leaf / "cgroup.kill").write_text("1\n")
                      assert child.wait(timeout=5) == -signal.SIGKILL
                  finally:
                      if child.poll() is None:
                          child.kill()
          finally:
              leaf.rmdir()
          print("Unprivileged delegated cgroup create, move, kill and removal verified", flush=True)
          PY
              exec "$@"
            ' forge-ci "$(command -v cargo)" +1.100.0 test --locked --all-targets -j 1
      - name: Verify dependency licenses and source package inclusion
        run: |
          cargo +1.100.0 fetch --locked
          cargo +1.100.0 package --list --locked --offline > "$RUNNER_TEMP/forge-package-list.txt"
          python3 scripts/check_notices.py --verify-registry-licenses --package-list "$RUNNER_TEMP/forge-package-list.txt"
      - name: Real no-model PostgreSQL smoke
        env:
          SMOKE_DB_FIXTURE_PASSWORD: fixture-only
        run: |
          FORGE_DATABASE_URL="$(printf '%s://%s:%s@%s:%s/%s' postgresql forge "$SMOKE_DB_FIXTURE_PASSWORD" 127.0.0.1 5432 forge_ci)"
          export FORGE_DATABASE_URL
          python3 scripts/smoke_installed.py
