[package]
name = "soulsteads-agent-forge"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Standalone native Rust DBOS execution with dashboard and authenticated MCP"
include = ["src/*.rs", "src/dbos/*.rs", "src/dbos/*.sql", "assets/*.html", "assets/*.js", "assets/*.css", "skills/*/SKILL.md", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/**"]

[lib]
name = "agent_forge"

[[bin]]
name = "agent-forge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dbos = { version = "=0.6.0", default-features = false, features = ["engine", "macros", "runtime-tokio"] }
chrono = { version = "=0.4.45", features = ["serde"] }
croner = { version = "=4.0.3", default-features = false, features = ["jiff"] }
jiff = "=0.2.43"
rusqlite = { version = "=0.30.0", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "2"
sha2 = "=0.10.8"
libc = "=0.2.191"
getrandom = "=0.2.10"
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "signal", "net", "time"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
jsonschema = { version = "=0.61.1", default-features = false }
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io", "macros"] }
agent-client-protocol = { version = "=3.3.0", default-features = false }
futures = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }

[features]
# Test-only generic stdio harness adapter; never part of a default build.
test-adapters = []

[dev-dependencies]
tempfile = "3"
